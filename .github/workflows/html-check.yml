
name: Validate HTML

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate HTML
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Initialize npm project
        run: npm init -y

      - name: Install HTML validator
        run: npm install --save-dev --save-exact html-validate@10.7.0

      - name: Validate the site
        run: npx --no-install html-validate index.html
